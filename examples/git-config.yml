repository: owner/repository
application: myapp
environment: production
token_file: /etc/nou10/github-token
state_dir: /var/lib/nou10/myapp-production
lock_dir: /run/nou10
execution_timeout: 10m
# Create this directory for the agent user; Git reuses it for every deployment.
install_root: /srv/myapp/repository
# Tracked AppSpec path; hook locations and cwd are relative to install_root.
git_appspec: appspec.yml
